<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar - Catatan Keuangan Keluarga</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo" style="width:52px;height:52px;font-size:24px;">💰</div>
      </div>
      <h1>Buat Akun</h1>
      <p class="sub">Daftar sebagai Suami atau Istri.</p>

      <div class="error-box" id="error-box"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Nama Lengkap</label>
          <input type="text" id="name" placeholder="cth: Budi" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="nama@email.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" placeholder="Minimal 6 karakter" required />
        </div>
        <div class="form-group">
          <label for="role">Saya adalah</label>
          <select id="role">
            <option value="suami">Suami</option>
            <option value="istri">Istri</option>
          </select>
        </div>
        <div class="form-group">
          <label for="code">Kode Rumah Tangga</label>
          <input type="text" id="code" placeholder="Tanya kode pada pasangan" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-register">Daftar</button>
      </form>

      <div class="auth-alt">Sudah punya akun? <a href="index.html">Masuk</a></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
