<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk - Catatan Keuangan Keluarga</title>
  <link rel="stylesheet" href="css/app.css?v=2" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo" style="width:52px;height:52px;font-size:24px;">💰</div>
      </div>
      <h1>Catatan Keuangan Keluarga</h1>
      <p class="sub">Pilih siapa Anda untuk masuk.</p>

      <div class="error-box" id="error-box"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="role">Saya adalah</label>
          <select id="role"></select>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-login">Masuk</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=2"></script>
  <script src="js/helpers.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
</body>
</html>
