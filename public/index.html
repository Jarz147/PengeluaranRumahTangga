<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk - Catatan Keuangan Keluarga</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo" style="width:52px;height:52px;font-size:24px;">💰</div>
      </div>
      <h1>Catatan Keuangan Keluarga</h1>
      <p class="sub">Kelola pengeluaran suami &amp; istri dalam satu tempat.</p>

      <div class="error-box" id="error-box"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="nama@email.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-login">Masuk</button>
      </form>

      <div class="auth-alt">Belum punya akun? <a href="register.html">Daftar</a></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
